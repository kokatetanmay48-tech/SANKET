<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#131d2e"/>
      <stop offset="85%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#05070a"/>
    </radialGradient>
    <radialGradient id="radarSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.4)"/>
      <stop offset="70%" stop-color="rgba(16, 185, 129, 0.08)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="92" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Radar Outer Rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#1e293b" stroke-width="2"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(16, 185, 129, 0.25)" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="105" fill="none" stroke="rgba(16, 185, 129, 0.35)" stroke-width="2"/>
  <circle cx="256" cy="256" r="50" fill="none" stroke="rgba(16, 185, 129, 0.5)" stroke-width="2"/>

  <!-- Radar Sweep Cone -->
  <path d="M 256 256 L 400 112 A 210 210 0 0 0 256 46 Z" fill="url(#radarSweep)"/>

  <!-- Crosshairs -->
  <line x1="256" y1="36" x2="256" y2="476" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2"/>
  <line x1="36" y1="256" x2="476" y2="256" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2"/>

  <!-- Degree Marks -->
  <circle cx="256" cy="46" r="4" fill="#38bdf8"/>
  <circle cx="466" cy="256" r="4" fill="#38bdf8"/>
  <circle cx="256" cy="466" r="4" fill="#38bdf8"/>
  <circle cx="46" cy="256" r="4" fill="#38bdf8"/>

  <!-- Drone Silhouette / Tactical Target in Center -->
  <g filter="url(#glow)">
    <!-- Central Reticle Ring -->
    <circle cx="256" cy="256" r="24" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="3"/>
    <circle cx="256" cy="256" r="6" fill="#10b981"/>

    <!-- Drone Rotors / Kinetic Icon -->
    <line x1="220" y1="220" x2="292" y2="292" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <line x1="220" y1="292" x2="292" y2="220" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>

    <circle cx="216" cy="216" r="10" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="296" cy="216" r="10" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="216" cy="296" r="10" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="296" cy="296" r="10" fill="none" stroke="#38bdf8" stroke-width="3"/>
  </g>

  <!-- Threat Target Blip (Red) -->
  <circle cx="345" cy="170" r="9" fill="#ef4444" filter="url(#glow)"/>
  <circle cx="345" cy="170" r="16" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- SANKET Tactical Text at Bottom -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="28" font-weight="900" fill="#10b981" letter-spacing="8" text-anchor="middle">SANKET</text>
  <text x="256" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="700" fill="#64748b" letter-spacing="4" text-anchor="middle">C2 DEFENSE SYSTEM</text>
</svg>
